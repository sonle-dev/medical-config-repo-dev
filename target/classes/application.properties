# Cổng chạy của Config Server theo yêu cầu (mặc định 8888)
server.port=8888

# Tên ứng dụng Config Server
spring.application.name=config-server

# Cấu hình trỏ tới kho lưu trữ Git cục bộ
spring.cloud.config.server.git.uri=file:///C:/medical-config-repo

# Nếu nhánh của bạn là master thay vì main, hãy uncomment dòng dưới đây:
# spring.cloud.config.server.git.default-label=master

# Nếu nhánh của bạn là main (mặc định của Git hiện đại), có thể chỉ định hoặc để trống:
spring.cloud.config.server.git.default-label=main